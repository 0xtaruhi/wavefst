name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Require an open linked issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          issue_number=$(grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' <<< "$body" \
            | head -n 1 | grep -Eo '[0-9]+' || true)
          if [[ -z "$issue_number" ]]; then
            echo "PR body must contain Closes, Fixes, or Resolves followed by #issue." >&2
            exit 1
          fi
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number")
          if [[ $(jq -r 'has("pull_request") or .state != "open"' <<< "$issue") == "true" ]]; then
            echo "#$issue_number must be an open issue in $GITHUB_REPOSITORY." >&2
            exit 1
          fi

  lint:
    name: Lint
    needs: pr-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check selective benchmark formatting
        run: cargo fmt --manifest-path benchmarks/selective/Cargo.toml -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (selective benchmark)
        run: cargo clippy --manifest-path benchmarks/selective/Cargo.toml --all-targets -- -D warnings
      - name: Rustdoc (all features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Verify release package
        run: cargo package --locked

  test:
    name: Tests (stable)
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cargo test
        run: cargo test --workspace --all-features

  test-beta:
    name: Tests (beta)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cargo test
        run: cargo test --workspace --all-features

  libfst-interop:
    name: Upstream libfst oracle
    needs: lint
    runs-on: ubuntu-latest
    env:
      LIBFST_SOURCE: ${{ runner.temp }}/libfst-reference
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native codec dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - name: Bidirectional libfst interoperability
        run: scripts/test-libfst-interop.sh
      - name: Selective benchmark smoke test
        env:
          SIGNALS: 100
          STEPS: 100
          SAMPLES: 1
          CASES: A D E
          CACHE_MODES: G-warm
          TRACE: target/selective-bench/ci-smoke.fst
          RESULTS: target/selective-bench/ci-smoke.csv
        run: scripts/bench-selective.sh

  feature-matrix:
    name: Feature matrix
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features reader,gzip,lz4"
          - "--no-default-features --features writer,gzip,lz4,simd"
          - "--no-default-features --features reader,writer,gzip,lz4,parallel"
          - "--no-default-features --features async-read,gzip,lz4"
          - "--no-default-features --features async-write,gzip,lz4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cargo test (${{ matrix.features }})
        run: cargo test --workspace ${{ matrix.features }}

  required-gate:
    name: Required gate
    if: always()
    needs: [pr-policy, lint, test, test-beta, libfst-interop, feature-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOBS"
