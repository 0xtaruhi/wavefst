[package]
name = "wavefst"
version = "0.3.0"
edition = "2024"
description = "Modern Rust implementation of the Fast Signal Trace (FST) binary waveform format."
authors = ["Zhengyi Zhang <zhang_zhengyi@outlook.com>"]
license = "MIT"
repository = "https://github.com/0xtaruhi/wavefst"
readme = "README.md"
keywords = ["fst", "waveform", "gtkwave", "verilog", "vhdl"]
categories = ["encoding", "parser-implementations", "science"]

[features]
default = ["reader", "writer", "gzip", "lz4", "simd"]

reader = []
writer = ["dep:ahash"]
gzip = ["dep:libdeflater"]
lz4 = ["dep:lz4_flex"]
fastlz = ["dep:fastlz-sys"]
parallel = ["dep:rayon"]
serde = ["reader", "dep:serde"]
async-read = ["reader", "dep:tokio"]
async-write = ["writer", "dep:tokio"]
async = ["async-read", "async-write"]
simd = ["writer"]

[dependencies]
ahash = { version = "0.8", optional = true }
num_enum = "0.7"
thiserror = "2.0"

lz4_flex = { version = "0.14", optional = true }
fastlz-sys = { version = "0.1", optional = true }
libdeflater = { version = "1.26", optional = true }
rayon = { version = "1.8", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
tokio = { version = "1.48.0", optional = true, features = ["fs", "io-util", "rt", "rt-multi-thread"] }

[dev-dependencies]
anyhow = "1.0"
criterion = "0.8"
tempfile = "3.10"

[[bench]]
name = "reader"
harness = false
required-features = ["reader", "writer"]

[[bench]]
name = "writer"
harness = false
required-features = ["writer"]

[[example]]
name = "libfst_bench"
required-features = ["reader", "writer"]

[[example]]
name = "write_fst"
required-features = ["writer"]

[[example]]
name = "writer_ecosystem_bench"
required-features = ["writer"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
manual_let_else = "warn"
match_same_arms = "warn"
option_option = "warn"
unnecessary_wraps = "warn"
